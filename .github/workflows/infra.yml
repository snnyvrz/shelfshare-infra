name: Infrastructure Validation

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: python -m pip install ansible

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r collections/requirements.yml

      - name: Validate charts
        run: |
          helm lint charts/books-service
          helm lint charts/envoy

      - name: Render cluster manifests
        run: |
          kustomize build clusters/local >/dev/null
          kustomize build clusters/production >/dev/null

      - name: Validate Ansible
        working-directory: ansible
        run: ansible-playbook --syntax-check playbooks/site.yml
